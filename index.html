<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trình Soạn Thảo Email Cao Cấp (Chuẩn Word/Outlook/Teams)</title>

    <!-- Dán các thẻ Open Graph vào đây -->
    <meta
      property="og:title"
      content="Trình Soạn Thảo Email Cao Cấp (Chuẩn Word/Outlook/Teams)"
    />
    <meta
      property="og:description"
      content="Công cụ hỗ trợ soạn thảo, định dạng chuẩn Outlook và chuyển đổi mã HTML cho Microsoft Teams."
    />
    <meta
      property="og:url"
      content="https://khanhhoa286.github.io/Email_Editor/"
    />
    <meta property="og:type" content="website" />
    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- TẢI TINYMCE: Ưu tiên dùng folder local 'tinymce/', nếu lỗi tự động fallback sang CDN -->
    <script
      src="tinymce/tinymce.min.js"
      onerror="
        this.onerror = null;
        this.src = 'https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js';
      "
    ></script>

    <style>
      /* TIÊU DIỆT TRIỆT ĐỂ NÚT UPGRADE VÀ LOGO TINY */
      .tox-promotion,
      .tox-statusbar__branding {
        display: none !important;
      }
      /* Cố định khung trình soạn thảo chuẩn rộng */
      .tox.tox-tinymce {
        width: 100% !important;
        border-radius: 0.5rem !important;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div
      class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200"
    >
      <!-- Header -->
      <div class="bg-blue-600 text-white p-6 flex justify-between items-center">
        <div>
          <h1 class="text-xl md:text-2xl font-bold flex items-center">
            <i class="fa-solid fa-file-word mr-3"></i> Trình Soạn Thảo Email Cao
            Cấp
          </h1>
          <p class="text-blue-100 text-sm mt-1">
            Đầy đủ font chữ, co giãn ảnh trực quan và chuyển đổi chuẩn
            Outlook/Teams.
          </p>
        </div>
        <button
          type="button"
          id="btn-clear"
          onclick="clearEditor()"
          title="Xóa toàn bộ nội dung"
          class="flex items-center space-x-1.5 bg-red-50 hover:bg-red-600 text-red-600 hover:text-white border border-red-300 hover:border-red-600 text-sm font-semibold px-3 py-1.5 rounded-lg transition-all duration-200 shadow-sm hover:shadow-md"
        >
          <i class="fa-solid fa-trash-can"></i>
          <span>Dọn Dẹp Nhanh</span>
        </button>
      </div>

      <div class="p-6 space-y-6">
        <!-- Khu vực soạn thảo -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-gray-700 font-semibold">
              <i class="fa-solid fa-pen-nib text-blue-600 mr-1"></i> Soạn thảo
              nội dung (Thao tác hệt như Word / Outlook):
            </label>
          </div>
          <textarea id="my-editor">
            <p style="font-family: Arial; font-size: 15px;">Xin chào mentor, đây là nội dung email mẫu...</p>
          </textarea>
        </div>

        <!-- Nút Convert -->
        <div class="text-center pt-2">
          <button
            type="button"
            onclick="handleConvert()"
            class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-lg shadow-md transition duration-200 flex items-center justify-center mx-auto space-x-2"
          >
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Chuyển Đổi Mã HTML</span>
          </button>
        </div>

        <!-- Khu vực kết quả -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-gray-200"
        >
          <!-- Outlook HTML -->
          <div
            class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col"
          >
            <div class="flex justify-between items-center mb-2">
              <span class="font-semibold text-gray-800 text-sm">
                <i class="fa-brands fa-microsoft text-blue-600 mr-1"></i> Dạng
                1: Outlook HTML
              </span>
              <button
                type="button"
                onclick="copyToClipboard('outlook-output', 'btn-outlook')"
                id="btn-outlook"
                class="bg-gray-200 hover:bg-blue-600 hover:text-white text-gray-700 text-xs px-3 py-1.5 rounded transition font-medium"
              >
                <i class="fa-regular fa-copy mr-1"></i> Copy HTML
              </button>
            </div>
            <textarea
              id="outlook-output"
              readonly
              class="w-full h-40 p-3 text-xs font-mono bg-white border border-gray-300 rounded focus:outline-none resize-none"
              placeholder="Bấm 'Chuyển Đổi' để lấy mã cho Outlook..."
            ></textarea>
          </div>

          <!-- Teams HTML -->
          <div
            class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col"
          >
            <div class="flex justify-between items-center mb-2">
              <span class="font-semibold text-gray-800 text-sm">
                <i class="fa-brands fa-teamspeak text-purple-600 mr-1"></i> Dạng
                2: Teams HTML
              </span>
              <button
                type="button"
                onclick="copyToClipboard('teams-output', 'btn-teams')"
                id="btn-teams"
                class="bg-gray-200 hover:bg-purple-600 hover:text-white text-gray-700 text-xs px-3 py-1.5 rounded transition font-medium"
              >
                <i class="fa-regular fa-copy mr-1"></i> Copy HTML
              </button>
            </div>
            <textarea
              id="teams-output"
              readonly
              class="w-full h-40 p-3 text-xs font-mono bg-white border border-gray-300 rounded focus:outline-none resize-none"
              placeholder="Bấm 'Chuyển Đổi' để lấy mã cho Teams..."
            ></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= CẤU HÌNH JAVASCRIPT & TINYMCE ================= -->
    <script>
      tinymce.init({
        selector: "#my-editor",
        height: 480,
        plugins:
          "preview searchreplace autolink directionality code visualblocks visualchars fullscreen image link media table charmap hr pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help emoticons",

        // Chia thành 2 dòng rõ rệt để hiển thị đầy đủ 100% công cụ, không bị ẩn vào nút ...
        toolbar1:
          "undo redo | styles fontfamily fontsize | bold italic underline strikethrough | forecolor backcolor removeformat | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent",
        toolbar2:
          "link image media table | charmap emoticons | hr pagebreak | fullscreen preview code",
        toolbar_sticky: true,

        // Giữ nguyên định dạng chuẩn khi paste từ Outlook/Word
        paste_as_text: false,
        paste_retain_style_properties: "all",
        paste_webkit_styles: "all",
        paste_merge_formats: true,

        // Hỗ trợ kéo thả / chọn ảnh và tự động chuyển sang Base64
        automatic_uploads: true,
        file_picker_types: "image",
        file_picker_callback: function (cb, value, meta) {
          var input = document.createElement("input");
          input.setAttribute("type", "file");
          input.setAttribute("accept", "image/*");
          input.onchange = function () {
            var file = this.files[0];
            var reader = new FileReader();
            reader.onload = function () {
              var id = "blobid" + new Date().getTime();
              var blobCache = tinymce.activeEditor.editorUpload.blobCache;
              var base64 = reader.result.split(",")[1];
              var blobInfo = blobCache.create(id, file, base64);
              blobCache.add(blobInfo);
              cb(blobInfo.blobUri(), { title: file.name });
            };
            reader.readAsDataURL(file);
          };
          input.click();
        },
        content_style:
          "body { font-family: Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6; color: #333333; }",
      });

      // Hàm DOMParser bóc tách sạch hoàn toàn nền rác, sọc trắng/xám khi chuyển sang Teams
      function cleanHtmlForTeams(html) {
        let parser = new DOMParser();
        let doc = parser.parseFromString(html, "text/html");
        doc.querySelectorAll("*").forEach(function (el) {
          el.style.backgroundColor = "";
          el.style.background = "";
          el.removeAttribute("bgcolor");
          el.removeAttribute("background");
          if (
            el.tagName === "TABLE" ||
            el.tagName === "TD" ||
            el.tagName === "TH"
          ) {
            el.style.borderCollapse = "collapse";
          }
        });
        return doc.body.innerHTML;
      }

      function handleConvert() {
        let rawHtml = tinymce.get("my-editor").getContent();
        if (!rawHtml.trim()) {
          alert("Vui lòng nhập nội dung email trước khi chuyển đổi!");
          return;
        }
        let outlookHtml =
          '<div style="font-family: Arial, sans-serif; font-size: 15px; color: #333333; line-height: 1.6;">' +
          rawHtml +
          "</div>";
        let cleanTeamsHtml = cleanHtmlForTeams(rawHtml);
        let teamsHtml =
          "<div style=\"font-family: 'Segoe UI', Helvetica, sans-serif; font-size: 14px; color: #242424; line-height: 1.5; background-color: transparent;\">" +
          cleanTeamsHtml +
          "</div>";
        document.getElementById("outlook-output").value = outlookHtml;
        document.getElementById("teams-output").value = teamsHtml;
      }

      function clearEditor() {
        if (!tinymce.get("my-editor").getContent().trim()) return;
        if (
          !confirm(
            "Bạn có chắc muốn xóa toàn bộ nội dung trong ô soạn thảo không?",
          )
        )
          return;
        tinymce.get("my-editor").setContent("");

        let btn = document.getElementById("btn-clear");
        let originalHTML = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Đã Dọn!</span>';
        btn.classList.add("bg-green-600", "text-white", "border-green-600");
        btn.classList.remove("bg-red-50", "text-red-600", "border-red-300");
        setTimeout(function () {
          btn.innerHTML = originalHTML;
          btn.classList.remove(
            "bg-green-600",
            "text-white",
            "border-green-600",
          );
          btn.classList.add("bg-red-50", "text-red-600", "border-red-300");
        }, 2000);
      }

      function copyToClipboard(elementId, buttonId) {
        handleConvert();
        let textarea = document.getElementById(elementId);
        if (!textarea.value) {
          alert("Chưa có mã HTML! Vui lòng soạn nội dung trước.");
          return;
        }
        textarea.select();
        navigator.clipboard.writeText(textarea.value);
        let btn = document.getElementById(buttonId);
        let originalHTML = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> Đã Copy!';
        btn.classList.add("bg-green-600", "text-white");
        setTimeout(function () {
          btn.innerHTML = originalHTML;
          btn.classList.remove("bg-green-600", "text-white");
        }, 2000);
      }
    </script>
  </body>
</html>
